<div id="updateEventModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 md:p-8 bg-black bg-opacity-50 transition-opacity duration-150">
    <div id="updateEventModalContent" class="bg-white w-full max-w-2xl rounded-2xl shadow-xl p-6 md:p-8 relative transform transition-all duration-150 opacity-0 scale-95 overflow-y-auto max-h-[90vh]">
        
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-bold text-gray-800">Edit Acara</h2>
            <button type="button" onclick="hideUpdateEventModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i class="far fa-times-circle text-2xl"></i>
            </button>
        </div>

        <form id="updateEventForm">
            {% csrf_token %}
            <div class="space-y-6">
                
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wide mb-2">Judul Acara & Emoji</label>
                    <div class="flex gap-2">
                        <input type="text" id="update_event_emoji" name="event_emoji" placeholder="🎫" class="w-16 text-center border border-gray-200 rounded-xl px-2 py-3 text-sm text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" required>
                        
                        <input type="text" id="update_event_title" name="event_title" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wide mb-2">Tanggal</label>
                        <input type="date" id="update_event_date" name="event_date" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wide mb-2">Waktu</label>
                        <input type="time" id="update_event_time" name="event_time" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wide mb-2">Venue</label>
                        <select id="update_venue_id" name="venue_id" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 bg-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                            {% for v in venues %}
                                <option value="{{ v.venue_id }}">{{ v.venue_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wide mb-2">Organizer</label>
                        <select id="update_organizer_id" name="organizer_id" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 bg-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                            {% for o in organizers %}
                                <option value="{{ o.organizer_id }}">{{ o.organizer_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wide mb-2">Deskripsi</label>
                    <textarea id="update_event_description" name="event_description" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none h-24" required></textarea>
                </div>
                
                <p class="text-xs text-amber-600 bg-amber-50 p-3 rounded-lg flex gap-2 items-start">
                    <i class="fas fa-exclamation-triangle mt-0.5"></i> 
                    Untuk menjaga integritas tiket yang sudah dibeli pengguna, Artis dan Kategori Tiket tidak dapat diubah dari menu ini.
                </p>

            </div>

            <div class="grid grid-cols-2 gap-4 mt-10 pt-4 border-t border-gray-200">
                <button onclick="hideUpdateEventModal()" type="button" class="w-full border border-gray-200 text-gray-800 font-bold py-3.5 rounded-xl text-sm hover:bg-gray-50 transition-colors">
                    Batal
                </button>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm transition-colors shadow-sm">
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>
</div>

<script>
  let currentUpdateEventId = '';

  function showUpdateEventModal(id, title, datetime, venueId, organizerId, description, emoji) {
      currentUpdateEventId = id;
      
      document.getElementById('update_event_emoji').value = emoji || '🎫';
      document.getElementById('update_event_title').value = title;
      
      const [datePart, timePart] = datetime.split(' ');
      document.getElementById('update_event_date').value = datePart;
      document.getElementById('update_event_time').value = timePart;

      document.getElementById('update_venue_id').value = venueId;
      document.getElementById('update_organizer_id').value = organizerId;
      document.getElementById('update_event_description').value = description;

      const modal = document.getElementById('updateEventModal');
      const modalContent = document.getElementById('updateEventModalContent');

      modal.classList.remove('hidden'); 
      setTimeout(() => {
        modalContent.classList.remove('opacity-0', 'scale-95');
        modalContent.classList.add('opacity-100', 'scale-100');
      }, 50); 
  }

  function hideUpdateEventModal() {
      const modal = document.getElementById('updateEventModal');
      const modalContent = document.getElementById('updateEventModalContent');

      modalContent.classList.remove('opacity-100', 'scale-100');
      modalContent.classList.add('opacity-0', 'scale-95');

      setTimeout(() => { modal.classList.add('hidden'); }, 150); 
  }

  document.getElementById("updateEventForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const form = e.target;
      
      try {
          const response = await fetch(`/event/update-event/${currentUpdateEventId}/`, {
              method: "POST",
              body: new FormData(form),
              headers: { 
                  "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value 
              }
          });
          
          const result = await response.json();
          
          if (response.ok) {
              hideUpdateEventModal();
              window.location.reload(); 
          } else {
              alert("Gagal mengupdate acara: " + result.message);
          }
      } catch (error) {
          console.error("Error:", error);
          alert("Terjadi kesalahan sistem.");
      }
  });
</script>
