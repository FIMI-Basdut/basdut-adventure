<div id="createEventModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 md:p-8 bg-black bg-opacity-50 transition-opacity duration-150">

    <div id="createEventModalContent" class="bg-white w-full max-w-4xl rounded-2xl shadow-xl p-6 md:p-8 relative transform transition-all duration-150 opacity-0 scale-95 overflow-y-auto max-h-[90vh]">
        
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-bold text-gray-800">Buat Acara Baru</h2>
            <button onclick="hideCreateEventModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i class="far fa-times-circle text-2xl"></i>
            </button>
        </div>

        <form id="createEventForm" onsubmit="event.preventDefault(); addEventEntry();">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase mb-2">Judul Acara & Emoji</label>
                        <div class="flex gap-2">
                            <input type="text" name="event_emoji" placeholder="Emoji" class="w-16 text-center border border-gray-200 rounded-xl px-2 py-3 text-sm transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700" required>
                            <input type="text" name="event_title" placeholder="cth. Konser Melodi Senja" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-2">Tanggal</label>
                            <input type="date" name="event_date" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700" required>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-2">Waktu</label>
                            <input type="time" name="event_time" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase mb-2">Venue</label>
                        <select name="venue_id" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 bg-white" required>
                            <option value="">-- Pilih Venue --</option>
                            {% for v in venues %}
                                <option value="{{ v.venue_id }}">{{ v.venue_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase mb-2">Organizer</label>
                        <select name="organizer_id" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 bg-white" required>
                            <option value="">-- Pilih Organizer --</option>
                            {% for o in organizers %}
                                <option value="{{ o.organizer_id }}">{{ o.organizer_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase mb-2">Pilih Artis & Role</label>
                        <div class="max-h-48 overflow-y-auto border border-gray-200 rounded-xl p-3 space-y-3">
                            {% for a in artists %}
                            <div class="flex items-center justify-between gap-4">
                                <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer flex-1">
                                    <input type="checkbox" name="artist_ids" value="{{ a.artist_id }}" class="rounded text-blue-500 focus:ring-blue-500">
                                    <span class="font-medium">{{ a.artist_name }}</span>
                                </label>
                                
                                <input type="text" name="role_{{ a.artist_id }}" placeholder="Role (cth: Headliner)" 
                                    class="w-1/2 border border-gray-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700">
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <div class="space-y-6 flex flex-col">
                    
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase mb-2">Kategori Tiket</label>
                        <div id="ticketCategoriesWrapper" class="space-y-3 max-h-48 overflow-y-auto pr-2">
                            <div class="ticket-row bg-gray-50 border border-gray-100 rounded-xl p-3">
                                <div class="flex gap-2 mb-2">
                                    <input type="text" name="ticket_category[]" placeholder="Nama Kategori (cth: VIP)" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700" required>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" name="ticket_price[]" placeholder="Harga" min="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700" required>
                                    <input type="number" name="ticket_quota[]" placeholder="Kuota" min="1" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700" required>
                                </div>
                            </div>
                        </div>
                        <button type="button" onclick="addTicketRow()" class="mt-3 text-blue-500 hover:text-blue-700 text-xs font-bold flex items-center gap-1.5">
                            <i class="fas fa-plus"></i> Tambah Kategori Lain
                        </button>
                    </div>

                    <div class="flex-1">
                        <label class="block text-[11px] font-bold text-gray-500 uppercase mb-2">Deskripsi Acara</label>
                        <textarea placeholder="Deskripsi acara..." name="event_description" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-colors hover:border-blue-700 focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 resize-none h-28" required></textarea>
                    </div>

                </div>
            </div>
        </form>

        <div class="grid grid-cols-2 gap-4 mt-8 pt-6 border-t border-gray-200">
            <button onclick="hideCreateEventModal()" type="button" class="w-full border border-gray-200 text-gray-800 font-bold py-3.5 rounded-xl text-sm hover:bg-gray-50">Batal</button>
            <button type="submit" form="createEventForm" class="w-full bg-[#82a4fc] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-sm">Buat Acara</button>
        </div>
    </div>
</div>

<script>
    function showCreateEventModal() {
        const modal = document.getElementById('createEventModal');
        const content = document.getElementById('createEventModalContent');
        modal.classList.remove('hidden'); 
        setTimeout(() => {
            content.classList.remove('opacity-0', 'scale-95');
            content.classList.add('opacity-100', 'scale-100');
        }, 50); 
    }

    function hideCreateEventModal() {
        const modal = document.getElementById('createEventModal');
        const content = document.getElementById('createEventModalContent');
        content.classList.remove('opacity-100', 'scale-100');
        content.classList.add('opacity-0', 'scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 150); 
    }

    // Fungsi menambah input row tiket
    function addTicketRow() {
        const wrapper = document.getElementById('ticketCategoriesWrapper');
        const row = document.createElement('div');
        row.className = 'ticket-row bg-gray-50 border border-gray-100 rounded-xl p-3 relative';
        row.innerHTML = `
            <button type="button" onclick="this.closest('.ticket-row').remove()" class="absolute top-2 right-2 text-red-400 hover:text-red-600">
                <i class="far fa-times-circle"></i>
            </button>
            <div class="flex gap-2 mb-2 pr-6">
                <input type="text" name="ticket_category[]" placeholder="Nama Kategori" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" required>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="number" name="ticket_price[]" placeholder="Harga" min="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" required>
                <input type="number" name="ticket_quota[]" placeholder="Kuota" min="1" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" required>
            </div>
        `;
        wrapper.appendChild(row);
    }

    document.getElementById('createEventForm').addEventListener('submit', async function(e) {
        // Mencegah browser me-reload halaman secara default
        e.preventDefault(); 
        
        const form = e.target;
        
        try {
            const response = await fetch("{% url 'event:add_event' %}", {
                method: "POST",
                body: new FormData(form),
                headers: { 
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value 
                }
            });
            
            const result = await response.json();
            
            if (response.ok) {
                form.reset();
                hideCreateEventModal();
                // Merefresh halaman otomatis agar event yang baru di-insert di DB
                // langsung muncul di list event
                window.location.reload(); 
            } else {
                alert("Gagal menambahkan acara: " + result.message);
            }
        } catch (error) {
            console.error("Error: ", error);
            alert("Terjadi kesalahan sistem saat menghubungi server.");
        }
    });
</script>
